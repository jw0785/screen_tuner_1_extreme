name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease
      - run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > /dev/shm/release.pk8
          echo "${{ secrets.SIGNING_CERT }}" > /dev/shm/release.pem
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --key /dev/shm/release.pk8 \
            --cert /dev/shm/release.pem \
            app/build/outputs/apk/release/app-release-unsigned.apk
          shred -u /dev/shm/release.pk8 /dev/shm/release.pem
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/screen-tuner-1x-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: app/build/outputs/apk/release/screen-tuner-1x-${{ github.ref_name }}.apk